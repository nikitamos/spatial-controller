[package]
name = "spatial"
version = "0.1.0"
edition = "2024"

[dependencies]
# embassy-sync = { version = "0.5.0" }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5.1" } #TODO: determine the clock tick rate
embassy-stm32 = { version = "0.6.0", features = [
    "stm32f411ce",
    "unstable-pac",
    "memory-x",
    "time-driver-any",
    "exti",
    "defmt",
] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.3.1"
panic-probe = { version = "0.3", features = ["print-defmt"] }
# panic-halt = "0.2.0"
# futures = { version = "0.3.17", default-features = false, features = [
#     "async-await",
# ] }
# heapless = { version = "0.7.5", default-features = false }
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-usb = { version = "0.6.0", features = [
    "default",
    "defmt",
    "max-interface-count-8",
    "max-handler-count-8",
] }
embassy-futures = "0.1.2"
usbd-hid = "0.10.2"
tle493d = { version = "0.1.0", path = "../tle493d" }
embassy-sync = "0.8.0"
# nb = "1.0.0"


[profile.release]
codegen-units = 1 # better optimizations
debug = true      # symbols are nice and they don't increase the size on Flash
lto = true        # better optimizations
